services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: bet
      POSTGRES_USER: bet
      POSTGRES_PASSWORD: bet
    ports:
      - "5432:5432"
    volumes:
      - bet_pgdata:/var/lib/postgresql/data
      - ../../db/migrations:/docker-entrypoint-initdb.d/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bet -d bet"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  bet_pgdata:
